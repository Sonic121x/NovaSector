<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<style>
html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
#capture { width: 100%; height: 100%; outline: none; }
</style>
</head>
<body>
<!--
	输入法安全键盘的按键捕获器。焦点停在这个**不可编辑**的元素上时，Chromium 会对自己的窗口
	关闭输入法，于是开着中文输入法也能收到干净的按键；再按 BYOND 原生宏的格式转发给服务器。
	用 KeyboardEvent.code（物理键位）而不是 key：输入法即使介入，key 会变成 "Process"，code 不受影响。
-->
<div id="capture" tabindex="0"></div>
<script>
(function () {
	var CODE_TO_BYOND = {
		ArrowUp: 'North', ArrowDown: 'South', ArrowLeft: 'West', ArrowRight: 'East',
		Home: 'Northwest', End: 'Southwest', PageUp: 'Northeast', PageDown: 'Southeast',
		Insert: 'Insert', Delete: 'Delete', Space: 'Space', Escape: 'Escape', Tab: 'Tab',
		Enter: 'Return', NumpadEnter: 'Return', Backspace: 'Back',
		ShiftLeft: 'Shift', ShiftRight: 'Shift', ControlLeft: 'Ctrl', ControlRight: 'Ctrl',
		AltLeft: 'Alt', AltRight: 'Alt',
		Backquote: '`', Minus: '-', Equal: '=', BracketLeft: '[', BracketRight: ']',
		Backslash: '\\', Semicolon: ';', Quote: "'", Comma: ',', Period: '.', Slash: '/',
		NumpadAdd: 'Add', NumpadSubtract: 'Subtract', NumpadMultiply: 'Multiply',
		NumpadDivide: 'Divide', NumpadDecimal: 'Decimal'
	};
	// code 缺失时（没有扫描码的合成按键、个别输入设备）按 keyCode 换算成同名的 code 再查。
	// 焦点在捕获器上时输入法已被关闭，keyCode 是真实的虚拟键码，不会是组字时的 229。
	var KEYCODE_TO_CODE = {
		37: 'ArrowLeft', 38: 'ArrowUp', 39: 'ArrowRight', 40: 'ArrowDown',
		36: 'Home', 35: 'End', 33: 'PageUp', 34: 'PageDown', 45: 'Insert', 46: 'Delete',
		32: 'Space', 27: 'Escape', 9: 'Tab', 13: 'Enter', 8: 'Backspace',
		16: 'ShiftLeft', 17: 'ControlLeft', 18: 'AltLeft',
		192: 'Backquote', 189: 'Minus', 187: 'Equal', 219: 'BracketLeft', 221: 'BracketRight',
		220: 'Backslash', 186: 'Semicolon', 222: 'Quote', 188: 'Comma', 190: 'Period', 191: 'Slash',
		107: 'NumpadAdd', 109: 'NumpadSubtract', 106: 'NumpadMultiply', 111: 'NumpadDivide', 110: 'NumpadDecimal'
	};
	function eventCode(e) {
		if (e.code) return e.code;
		var k = e.keyCode;
		if (k >= 65 && k <= 90) return 'Key' + String.fromCharCode(k);
		if (k >= 48 && k <= 57) return 'Digit' + (k - 48);
		if (k >= 96 && k <= 105) return 'Numpad' + (k - 96);
		if (k >= 112 && k <= 123) return 'F' + (k - 111);
		return KEYCODE_TO_CODE[k] || '';
	}
	function toByondKey(code) {
		if (CODE_TO_BYOND[code]) return CODE_TO_BYOND[code];
		var m = /^Key([A-Z])$/.exec(code); if (m) return m[1];
		m = /^Digit([0-9])$/.exec(code); if (m) return m[1];
		m = /^Numpad([0-9])$/.exec(code); if (m) return 'Numpad' + m[1];
		m = /^F([0-9]{1,2})$/.exec(code); if (m) return code;
		return null;
	}
	function call(path, params) {
		var url = 'byond://' + path + '?';
		var first = true;
		for (var key in params) {
			url += (first ? '' : '&') + encodeURIComponent(key) + '=' + encodeURIComponent(params[key]);
			first = false;
		}
		if (window.cef_to_byond) { window.cef_to_byond(url); return; }
		location.href = url;
	}
	function send(command) { call('winset', { command: command }); }

	// 焦点回收全在客户端本地做（winget/winset 不经服务器）：点地图、聊天框关闭后被设回地图、
	// 弹窗关闭…… 这些都会让原生地图控件拿到焦点，输入法随之接管。只认「焦点在地图上」这一种情形：
	// 聊天输入、TGUI 文本框、弹窗一律不抢 —— 那些地方本来就该让输入法工作；焦点为空（切到了别的
	// 程序）也不抢，否则 Alt-Tab 出去会被拉回游戏。
	var callbackSerial = 0;
	function winget(id, property, done) {
		var name = '__imeCaptureCallback' + (callbackSerial++);
		window[name] = function (props) { delete window[name]; done(props || {}); };
		call('winget', { id: id, property: property, callback: name });
	}
	function isMapFocus(focus) {
		return !!focus && (focus === 'map' || /(^|\.)map$/.test(focus) || focus === 'mapwindow');
	}
	var checking = false;
	// 失焦后还没弄清焦点去向：去了地图就收回、按着的键保留；去了别处就全部松开。
	var releaseIfElsewhere = false;
	// 焦点为空 = DreamSeeker 不在前台，查慢一点；回到前台时 Windows 会把焦点还给切走前那个控件。
	var pollDelay = 150;
	function poll() {
		checkFocus();
		setTimeout(poll, pollDelay);
	}
	function checkFocus() {
		if (checking || document.hasFocus()) return;
		checking = true;
		winget('', 'focus', function (props) {
			checking = false;
			pollDelay = props.focus ? 150 : 500;
			if (document.hasFocus()) return;
			var release = releaseIfElsewhere;
			releaseIfElsewhere = false;
			if (isMapFocus(props.focus)) call('winset', { id: 'ime_capture', focus: 'true' });
			else if (release) releaseAll();
		});
	}
	poll();
	// 服务端注入：原生宏在客户端执行的那部分（Esc/Tab/退格、管理员 asay 键），键 → 原始命令。
	var MACRO_COMMANDS = /*IME_MACRO_COMMANDS*/{};
	// 服务端眼里「按着」的键。浏览器的自动连发不转发，服务端自己有 keyLoop。
	var held = {};
	function keyUpCommand(key) { return 'KeyUp "' + key + '" [[map.mouse-pos]] [[map.size]]'; }
	function releaseAll() {
		for (var key in held) send(keyUpCommand(key));
		held = {};
	}
	function onKey(e) {
		var key = toByondKey(eventCode(e));
		if (!key) return;
		e.preventDefault();
		if (e.type === 'keydown') {
			if (e.repeat) {
				// 在地图拿着焦点时按下、焦点收回后还按着：原生宏已经发过 KeyDown，接过来让松开从这里发。
				held[key] = true;
				return;
			}
			// 上一次按下的松开发生在地图上（原生宏已发 KeyUp）：先补齐，再当一次新的按下。
			if (held[key]) send(keyUpCommand(key));
			held[key] = true;
			if (MACRO_COMMANDS[key]) send(MACRO_COMMANDS[key]);
			send('KeyDown "' + key + '" [[map.mouse-pos]] [[map.size]]');
		} else {
			if (!held[key]) return;
			delete held[key];
			send(keyUpCommand(key));
		}
	}
	window.addEventListener('keydown', onKey, true);
	window.addEventListener('keyup', onKey, true);
	// 失焦时先看焦点去了哪：去了地图（点地图扔东西、边走边点）就立刻收回，按着的键**不松开** ——
	// 它们在物理上还按着，松开要么回到这里发，要么焦点在地图那一刻由原生宏发。去了别处（聊天栏、
	// 别的程序）才全部松开，否则会留下「卡住」的移动键、Alt-Tab 留下按着的 Alt。
	window.addEventListener('blur', function () {
		releaseIfElsewhere = true;
		setTimeout(checkFocus, 0);
	});
	window.addEventListener('pagehide', releaseAll);
	var capture = document.getElementById('capture');
	capture.focus();
	window.addEventListener('focus', function () { capture.focus(); });
})();
</script>
</body>
</html>
