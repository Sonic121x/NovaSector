2026-09-11:
  sernseek:
  - bugfix: 修复被冻住的灯具把颜色矩阵误当成灯光颜色的问题。
  - bugfix: 修复界面刷新后，旧窗口的点击仍被当作新窗口操作的问题。
2026-09-18:
  sernseek:
  - rscadd: 同步上游新内容并完成汉化：手提音响与音乐磁带、大批新地板与墙壁材质等。
2026-09-22:
  sernseek:
  - bugfix: 修复打开铁板/皮革制作菜单时全服卡顿数秒的问题：每生成一个材料堆，菜单里就会多出一份重复配方，对局越久越卡。
  - bugfix: 修复穿梭机每次进出超空间都会残留一个「超空间」区域的问题，传送菜单不再堆出上百个超空间。
  - rscadd: 游戏内更新日志新增「汉化版更新」栏目，专门记录本汉化版自己的改动。
2026-09-23:
  sernseek:
  - rscadd: 「更新日志」页签里 Nova Sector 上游的更新条目现在显示中文翻译（从 2026 年 9 月起，随每次同步上游更新）。
2026-09-28:
  sernseek:
  - rscadd: 文字转语音升级到新模型，音色更自然，可选音色增至 60 多个，含方言与多语种音色；声音设置里的音色列表显示中文名与特点，旧存档的音色会自动换成相近的新音色。
  - rscadd: 文字转语音会带上情绪：喊叫时大喊、耳语时低声、重伤时颤抖；自定义说话动词也会生效，例如「哭着*」会带哭腔，「大笑*」「叹气*」「咳嗽*」会先笑出声、叹气或咳嗽。
  - rscadd: 声音设置新增「声音描述」（如：沙哑的老年男性，带四川口音）和「语速」，音高调整也重新可用。
  - rscadd: 全站广播的语音改为播音腔。
  - rscadd: 聊天输入框（按 T）右侧新增「情」按钮，可以直接选择「哭着说」「低声说」「大笑着说」等说话方式，文字和语音都会带上对应情绪。
  - rscadd: 类人角色的笑、叹气、咳嗽、哭、打哈欠、尖叫等发声动作改用角色自己的语音；物种专属的叫声不变，可在声音设置里关闭「语音化表情动作」。
  - rscadd: 赞助者可以在声音设置的「定制音色」或 OOC 栏的「定制音色」里用文字描述设计专属音色，或上传本人录音复刻音色；所有定制音色需管理员审核后才能使用。
  - admin: 新增管理员菜单「审核定制音色」，可试听、通过、拒绝或删除玩家提交的定制音色。
  - rscadd: 聊天输入框的「情」按钮增加到 47 种说话方式，并支持滚动；标签覆盖不到的写法（如「醉醺醺地说」「害羞地说」，包括自己输入的任何说话动词）也会作为语气指示传给语音。
  - rscadd: 录音复刻上传后会立即生成音色并提供试听，不用等审核；管理员审核时可以同时试听复刻效果和原录音。
  - bugfix: 修复售货机、NPC 等说出的台词在聊天框里是中文、但语音和头顶文字仍是英文的问题。
