2026-11-01:
  sernseek:
  - bugfix: 修复开启「输入法友好按键」后，按住方向键边走边点地图、换方向时，原来的方向键偶尔卡住、人一直往那个方向走的问题。
  - bugfix: 修复玩家角色名恰好是英文单词时（比如「Not」），在环绕菜单等界面里被当成普通词翻译（显示成「不是」）的问题。
  - qol: 幽灵菜单「幽灵角色通知」里剩下的英文类别名（灰烬行者蛋、团块孢子、魔像等）已翻译。
  - rscadd: 说话框新增「频」按钮：点开就能选无线电频道和说话用的语言，不用再切英文输入法打 ; :e ,x 这些前缀。选了别的语言会一直沿用，直到换回去。
  - qol: 点死亡竞赛的「加入」链接时，如果大厅已经关闭或比赛已经开始，现在会提示原因，而不是没有任何反应。
  - bugfix: APC 界面的标题（如「拘留区控制室 APC」）、外部供电与充电状态已翻译。
  - bugfix: 人物检视里的 MOD 套装部件名、ID 卡名、「仔细查看」链接和冲突加入等级已翻译；偏好菜单里的冲突加入选项也已翻译。
  - bugfix: 焊接面罩等物品的「切换」动作按钮已翻译。
  - bugfix: 勘探无人机控制台的工具选择一打开就是中文。
  - bugfix: 游戏选项的分类页签（辅助功能、聊天、声音等）已翻译。
  - code_imp: 汉化层的翻译查找加了缓存：聊天和检视里的人名等查不到译文的内容，查找开销降到原来的约八分之一。
  - qol: 导航去别的楼层时，到达一层后会自动接着画下一段路线（下一个楼梯/梯子，或到了目标那层就直接画到目标），不用每层重新导航；相隔两层以上的目的地也能导航了，列表里的（上方）/（下方）也标对了。
  - bugfix: 幽灵征召提问里直接写英文的那批（如逃犯猎人小队「Do you wish to be considered for a group of …?」）现在会整句翻译，逃犯猎人各小队名也有了中文。
  - bugfix: 动态中途反派（蜘蛛、巫师、核特工、异形等）共用的征召提问「Looking for volunteers to become …」、海盗船员、血虫孵化与比特奔行临时反派的征召提问现在都有中文了。
  - bugfix: 修复默认征召提问「你想扮演……吗」里角色名的高亮样式丢失（标签被拆成 <spanclass=…>），以及「X 的 Y」这类两个高亮名并列的提问整句不翻译。
  - bugfix: N谱扫描仪没扫出违禁品时，提示由「清除」改为「未发现违禁品」。
  - rscadd: 按 Esc 打开的菜单（继续、角色、设置、玩家、管理员帮助、退出等）汉化了，中文用像素字体显示。
  - bugfix: 百科书（化学教科书、医疗指南等）和游戏内的 wiki 链接改用 index.php?title= 格式，不依赖 wiki 站点的短链接设置，换到新的中文 wiki 后也能正常打开。
  - config: 新增配置项 MANUAL_WIKIURL：百科书等游戏内指南单独指向一个 wiki，WIKIURL（wiki 命令、Esc 菜单）继续指向服务器自己的 wiki。
2026-11-02:
  sernseek:
  - bugfix: 防火门、火警器、空气警报、APC 这类「区域名 + 设备名」的名字现在能正确显示成中文（之前因为区域名里的隐藏标记整类显示英文）。
  - bugfix: 售货机广告词和 NPC 台词里带撇号的句子（如 Don't…、It's…）现在会显示中文。
  - bugfix: 电路板「(Machine Board)」、水培盘「托盘 (植物名)」、海报和画作「海报 - …」、个人物品「某某的旅行手提箱」、破碎的酒瓶、道具交接提示「某某正在递出…」、厨师订购台「市售…」等运行期拼出的名字现在会显示中文。
  - bugfix: 基因控制台的可用染色体、RPD 的管道方向、快递控制台的信标价格、AI 状态面板里的赛博状态行、血族的血量显示、生物强化手术的前置条件、物品「调整…」动作按钮都汉化了。
  - bugfix: 部门预算卡的账户名、紧急穿梭机等公告发送者、伤口名后的括号、攻击动词里的「徒劳地…/粉碎」、DNA 注射器的「激活剂/诱变剂」现在都显示中文。
  - bugfix: MOD 套装各部件的描述前半句不再是英文；异教徒飞升时的全站公告现在有中文了。
  - bugfix: 幽灵频道的播报（某人已重新连接、已断开、已观察、死于某处、呼叫/召回穿梭机、修改警戒等级等）现在显示中文。
  - bugfix: 各类机器线路面板上的状态行（如售货机「扬声器指示灯」、气闸「门闩已锁定」）现在能正确显示中文。
  - bugfix: 订购台「感谢您的购买！」等由多句拼成的提示不再只翻一半；乐器编辑器的延音按钮、街机新游戏提示、货运出口报告的物品单位名都汉化了。
  - bugfix: 引号里引用的玩家原话（幽灵说话、留言等）不会再被当成游戏文本误翻。
  - bugfix: 梦境里出现的床单名词（颜色、职业、动物等）和「听到声音」类梦境的文字现在显示中文。
  - bugfix: 被改成全小写或逐词大写的物品名（如订购台、采矿商店里的商品、异常核心名）现在也能显示中文。
  - bugfix: 大厅已准备玩家列表里的「某人 as 职业」「a mysterious 职业」改为中文显示，职业名一并翻译。
  - bugfix: 电路编辑器里的端口名、法医扫描的纤维来源、核特工追踪器的检查文字现在显示中文（存档与扫描数据本身不受影响）。
