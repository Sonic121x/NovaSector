2026-08-17:
  sernseek:
  - bugfix: 补上界面里仍显示英文的物品/试剂/材料/配方等名称：化学机器、睡眠舱、医疗终端、售货与货运目录、矿石与材料面板、径向菜单、列表弹窗、大气与研究界面等 67 处显示名现在会本地化。
  - bugfix: 赛博注射器与调酒器的试剂名改为显示译名，按钮功能不受影响。
  - bugfix: 修复本地化文本填充：当某个参数的值本身含有 `{1}` 这类占位符形态（纸张文本、玩家自定义命名等）时，它会被后一个参数顶掉，导致整句显示错乱。
  - code_imp: 本地化 HTML 落地层（每条聊天消息与每个浏览器页面都会经过）改用 BYOND 原生的 spantext/findtext 扫描标签，取代逐字节 copytext 循环，显著减少大页面（记录台、健康扫描报告等）的字符串分配。
  - code_imp: 物品与地板的名称、描述不再在地图加载时逐个实例原地改写，改为只在检查、悬停提示等显示边界本地化；这去掉了初始化期的全图外观写入，也可能缓解中文服更频繁的静态光照灰屏（尚未实测证实）。
  - bugfix: 玩家自定义名、角色名、宠物挂牌名、赛博编号等运行时名称不会再被词库碰巧翻译。
  - bugfix: 关闭了 TGUI 输入框偏好的玩家，原生列表选择窗现在也显示译名。
  - bugfix: 异种、防火门、火警器、酒吧招牌、香烟等的名称回到内部英文形态，显示时再翻译——修掉按英文名解析区域前缀/比对类型名的一类失效。
  - bugfix: 投票、恶意 AI 模块、化学反应、设计图、材料与试剂里那些单词名称（此前界面上恒为英文）现在会显示译名，按钮与查表仍按原名工作。
  - rscadd: 新增「新人软管制」：游戏时长不足且连接来源不在地区名单内的玩家会被临时和平化，并暂时无法拆解设备或操作火警、大气、APC、核弹等高危设施。检查、对话、移动、开门与使用电脑均不受影响。
  - rscadd: 受管制的玩家在本回合存活满设定时间后，限制会自动全部解除；也可以在提示中直接提交申诉，管理员批准后永久豁免。
  - admin: 新增管理员 verb：切换新人软管制、新人软管制名单、豁免新人软管制、重载地区数据表。
  - config: 新增 NEWBIE_GUARD、NEWBIE_GUARD_PLAYTIME、NEWBIE_GUARD_SURVIVAL、NEWBIE_GUARD_BYPASS_DAYS 配置项。
